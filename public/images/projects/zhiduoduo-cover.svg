<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1a0a"/>
      <stop offset="100%" stop-color="#1a3a2a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="stem" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.06" stroke="#34d399" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>
  
  <!-- Floating particles -->
  <circle cx="120" cy="80" r="2" fill="#34d399" opacity="0.3"/>
  <circle cx="680" cy="120" r="1.5" fill="#6ee7b7" opacity="0.25"/>
  <circle cx="200" cy="380" r="2.5" fill="#34d399" opacity="0.2"/>
  <circle cx="650" cy="350" r="1.8" fill="#6ee7b7" opacity="0.3"/>
  <circle cx="750" cy="80" r="2" fill="#34d399" opacity="0.2"/>
  <circle cx="80" cy="300" r="1.5" fill="#6ee7b7" opacity="0.25"/>
  
  <!-- Main plant illustration -->
  <!-- Pot -->
  <path d="M360 340 L370 380 L430 380 L440 340 Z" fill="#92400e" opacity="0.8"/>
  <rect x="355" y="332" width="90" height="12" rx="3" fill="#b45309" opacity="0.9"/>
  
  <!-- Main stem -->
  <path d="M400 332 Q398 280 400 220 Q402 180 400 150" stroke="url(#stem)" stroke-width="4" fill="none"/>
  
  <!-- Left branch -->
  <path d="M400 260 Q370 240 340 230" stroke="url(#stem)" stroke-width="3" fill="none"/>
  
  <!-- Right branch -->
  <path d="M400 220 Q430 200 460 190" stroke="url(#stem)" stroke-width="3" fill="none"/>
  
  <!-- Top branch -->
  <path d="M400 180 Q385 155 370 140" stroke="url(#stem)" stroke-width="2.5" fill="none"/>
  
  <!-- Leaves -->
  <!-- Large leaf left -->
  <ellipse cx="320" cy="215" rx="35" ry="18" transform="rotate(-25 320 215)" fill="url(#leaf)" opacity="0.85"/>
  <path d="M300 220 Q320 210 340 215" stroke="#047857" stroke-width="1" fill="none" opacity="0.5"/>
  
  <!-- Large leaf right -->
  <ellipse cx="475" cy="175" rx="30" ry="16" transform="rotate(20 475 175)" fill="url(#leaf)" opacity="0.85"/>
  <path d="M455 172 Q475 168 495 175" stroke="#047857" stroke-width="1" fill="none" opacity="0.5"/>
  
  <!-- Top leaf -->
  <ellipse cx="355" cy="125" rx="28" ry="14" transform="rotate(-35 355 125)" fill="url(#leaf)" opacity="0.85"/>
  
  <!-- Small leaf on stem -->
  <ellipse cx="410" cy="290" rx="18" ry="10" transform="rotate(30 410 290)" fill="url(#leaf)" opacity="0.7"/>
  
  <!-- Small leaf -->
  <ellipse cx="390" cy="180" rx="15" ry="8" transform="rotate(-15 390 180)" fill="#6ee7b7" opacity="0.6"/>
  
  <!-- Glow around plant -->
  <circle cx="400" cy="230" r="100" fill="#34d399" opacity="0.04"/>
  <circle cx="400" cy="230" r="70" fill="#34d399" opacity="0.06"/>
  
  <!-- AI recognition scan lines -->
  <rect x="330" y="140" width="140" height="200" rx="8" stroke="#34d399" stroke-width="1.5" fill="none" opacity="0.3" stroke-dasharray="6 4"/>
  <circle cx="340" cy="150" r="4" fill="#34d399" opacity="0.5"/>
  <circle cx="460" cy="150" r="4" fill="#34d399" opacity="0.5"/>
  <circle cx="340" cy="330" r="4" fill="#34d399" opacity="0.5"/>
  <circle cx="460" cy="330" r="4" fill="#34d399" opacity="0.5"/>
  
  <!-- AI label -->
  <rect x="345" y="145" width="50" height="18" rx="9" fill="#34d399" opacity="0.2"/>
  <text x="370" y="158" text-anchor="middle" font-family="monospace" font-size="10" fill="#34d399" opacity="0.8">AI SCAN</text>
  
  <!-- Title text -->
  <text x="580" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="white" letter-spacing="-1">植多多</text>
  <text x="580" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#6ee7b7" opacity="0.8">ZhiDuoDuo</text>
  
  <!-- Subtitle -->
  <text x="580" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#a7f3d0" opacity="0.7">植物百科 · AI识别 · 科普平台</text>
  
  <!-- Tech tags -->
  <rect x="580" y="270" width="50" height="22" rx="11" fill="#34d399" opacity="0.15"/>
  <text x="605" y="285" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6ee7b7">Vue 3</text>
  
  <rect x="638" y="270" width="62" height="22" rx="11" fill="#34d399" opacity="0.15"/>
  <text x="669" y="285" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6ee7b7">Express</text>
  
  <rect x="708" y="270" width="40" height="22" rx="11" fill="#34d399" opacity="0.15"/>
  <text x="728" y="285" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6ee7b7">AI</text>
  
  <rect x="580" y="300" width="30" height="22" rx="11" fill="#34d399" opacity="0.15"/>
  <text x="595" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6ee7b7">API</text>
  
  <rect x="618" y="300" width="55" height="22" rx="11" fill="#34d399" opacity="0.15"/>
  <text x="645" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6ee7b7">小程序</text>
  
  <rect x="681" y="300" width="50" height="22" rx="11" fill="#34d399" opacity="0.15"/>
  <text x="706" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6ee7b7">MySQL</text>
  
  <!-- Decorative data viz elements -->
  <!-- Mini bar chart -->
  <g transform="translate(580, 340)" opacity="0.4">
    <rect x="0" y="20" width="8" height="30" rx="2" fill="#34d399"/>
    <rect x="12" y="10" width="8" height="40" rx="2" fill="#6ee7b7"/>
    <rect x="24" y="25" width="8" height="25" rx="2" fill="#34d399"/>
    <rect x="36" y="5" width="8" height="45" rx="2" fill="#6ee7b7"/>
    <rect x="48" y="15" width="8" height="35" rx="2" fill="#34d399"/>
  </g>
  
  <!-- Mini map pin -->
  <g transform="translate(660, 340)" opacity="0.4">
    <path d="M15 0 C6.7 0 0 6.7 0 15 C0 26.25 15 40 15 40 C15 40 30 26.25 30 15 C30 6.7 23.3 0 15 0 Z" fill="#34d399"/>
    <circle cx="15" cy="15" r="6" fill="#0a1a0a"/>
  </g>
</svg>
